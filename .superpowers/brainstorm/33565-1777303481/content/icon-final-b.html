<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #150d06;
    color: #F5EDE0;
    font-family: sans-serif;
    padding: 40px 24px 60px;
    min-height: 100vh;
  }
  h2 { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .sub { color: #C4A882; font-size: 13px; text-align: center; margin-bottom: 36px; }
  .main-preview { display: flex; justify-content: center; margin-bottom: 40px; }
  .icon-bg {
    background: #3D2B1F;
    border-radius: 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .sizes-row {
    display: flex; gap: 20px; justify-content: center; align-items: flex-end; margin-bottom: 32px;
  }
  .size-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .size-item span { font-size: 11px; color: #6a5038; font-family: monospace; }
  .note { text-align: center; font-size: 12px; color: #7a6048; margin-top: 10px; }
</style>
</head>
<body>

<h2>Naza + Palo de amasar</h2>
<p class="sub">Sin gorrito — solo el palo y el nombre</p>

<div class="main-preview">
  <div class="icon-bg" style="width:240px;height:240px;">
    <svg width="220" height="220" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">

      <!-- ROLLING PIN diagonal -->
      <g transform="rotate(-20, 100, 100)">
        <!-- left handle -->
        <rect x="6"   y="88" width="26" height="16" rx="8" fill="#C4A882"/>
        <!-- cylinder body -->
        <rect x="30"  y="86" width="140" height="20" rx="10" fill="#C4A882"/>
        <!-- shine on cylinder -->
        <rect x="30"  y="88" width="140" height="6"  rx="3" fill="#E0CEAD" opacity="0.6"/>
        <!-- subtle shadow line on cylinder -->
        <rect x="30"  y="102" width="140" height="3" rx="2" fill="#9A7850" opacity="0.35"/>
        <!-- right handle -->
        <rect x="168" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
        <!-- handle detail lines -->
        <line x1="18"  y1="90" x2="18"  y2="102" stroke="#9A7850" stroke-width="1.2" opacity="0.5"/>
        <line x1="22"  y1="90" x2="22"  y2="102" stroke="#9A7850" stroke-width="1.2" opacity="0.4"/>
        <line x1="178" y1="90" x2="178" y2="102" stroke="#9A7850" stroke-width="1.2" opacity="0.5"/>
        <line x1="182" y1="90" x2="182" y2="102" stroke="#9A7850" stroke-width="1.2" opacity="0.4"/>
      </g>

      <!-- "Naza" script -->
      <text
        x="100" y="158"
        font-family="'Dancing Script', cursive"
        font-size="72"
        font-weight="700"
        fill="#F5EDE0"
        text-anchor="middle"
        dominant-baseline="auto">Naza</text>

    </svg>
  </div>
</div>

<!-- SIZES -->
<div class="sizes-row">

  <div class="size-item">
    <div class="icon-bg" style="width:120px;height:120px;border-radius:24px;">
      <svg width="108" height="108" viewBox="0 0 200 200" fill="none">
        <g transform="rotate(-20,100,100)">
          <rect x="6" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
          <rect x="30" y="86" width="140" height="20" rx="10" fill="#C4A882"/>
          <rect x="30" y="88" width="140" height="6" rx="3" fill="#E0CEAD" opacity="0.6"/>
          <rect x="168" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
        </g>
        <text x="100" y="158" font-family="'Dancing Script', cursive" font-size="72" font-weight="700" fill="#F5EDE0" text-anchor="middle">Naza</text>
      </svg>
    </div>
    <span>192px</span>
  </div>

  <div class="size-item">
    <div class="icon-bg" style="width:80px;height:80px;border-radius:17px;">
      <svg width="70" height="70" viewBox="0 0 200 200" fill="none">
        <g transform="rotate(-20,100,100)">
          <rect x="6" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
          <rect x="30" y="86" width="140" height="20" rx="10" fill="#C4A882"/>
          <rect x="30" y="88" width="140" height="6" rx="3" fill="#E0CEAD" opacity="0.6"/>
          <rect x="168" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
        </g>
        <text x="100" y="158" font-family="'Dancing Script', cursive" font-size="72" font-weight="700" fill="#F5EDE0" text-anchor="middle">Naza</text>
      </svg>
    </div>
    <span>96px</span>
  </div>

  <div class="size-item">
    <div class="icon-bg" style="width:48px;height:48px;border-radius:10px;">
      <svg width="42" height="42" viewBox="0 0 200 200" fill="none">
        <g transform="rotate(-20,100,100)">
          <rect x="6" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
          <rect x="30" y="86" width="140" height="20" rx="10" fill="#C4A882"/>
          <rect x="168" y="88" width="26" height="16" rx="8" fill="#C4A882"/>
        </g>
        <text x="100" y="158" font-family="'Dancing Script', cursive" font-size="72" font-weight="700" fill="#F5EDE0" text-anchor="middle">Naza</text>
      </svg>
    </div>
    <span>48px</span>
  </div>

  <div class="size-item">
    <div class="icon-bg" style="width:32px;height:32px;border-radius:7px;">
      <svg width="28" height="28" viewBox="0 0 200 200" fill="none">
        <g transform="rotate(-20,100,100)">
          <rect x="30" y="86" width="140" height="20" rx="10" fill="#C4A882"/>
        </g>
        <text x="100" y="162" font-family="'Dancing Script', cursive" font-size="72" font-weight="700" fill="#F5EDE0" text-anchor="middle">N</text>
      </svg>
    </div>
    <span>32px</span>
  </div>

</div>

<p class="note">A 32px solo se ve el palo + "N" — el resto no es legible a ese tamaño.</p>
<p class="note" style="margin-top:20px;">¿Ajustamos algo? Ángulo del palo, tamaño del texto, posición relativa...</p>

</body>
</html>
